[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataframe-mutator"
version = "2.0.0"
description = "mutmut extension for Polars DataFrame support. Adds 109 Polars-specific operators and smart filtering to mutation testing."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Dataframe Mutator Contributors", email = "suhrusai@gmail.com"}
]
keywords = ["mutation-testing", "polars", "dataframe", "testing", "test-quality", "data-pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mutmut>=2.4.0",  # Required: base mutation testing engine
    "click>=8.0.0",   # Required: CLI framework
]


[project.entry-points."mutmut.operators"]
polars = "dataframe_mutator.mutmut_plugin:get_plugin"

[project.entry-points."mutmut.filters"]
polars = "dataframe_mutator.mutmut_plugin:get_plugin"

[project.urls]
Homepage = "https://github.com/suhrusai/dataframe-mutator"
Documentation = "https://github.com/suhrusai/dataframe-mutator#readme"
Repository = "https://github.com/suhrusai/dataframe-mutator.git"
Issues = "https://github.com/suhrusai/dataframe-mutator/issues"

[project.optional-dependencies]
polars = ["polars>=0.19.0"]
pyspark = ["pyspark>=3.0.0"]
pandas = ["pandas>=1.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "dataframe-mutator[polars,pyspark,pandas,dev]",
]

[tool.setuptools]
packages = ["dataframe_mutator"]

[tool.setuptools.package-dir]
dataframe_mutator = "src/dataframe_mutator"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# Strict rule selection like Polars
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort imports
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "T20",    # flake8-print
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by black)
    "W505",   # Doc line too long
    "N802",   # Function name should be lowercase (for test functions)
    "N803",   # Argument name should be lowercase
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]  # Test functions don't need to use all args
"__init__.py" = ["F401"]  # Imports may be used for re-export

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true
