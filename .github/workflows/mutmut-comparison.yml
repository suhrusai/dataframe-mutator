name: Mutmut Plugin Comparison

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run comparison daily at 1 AM UTC
    - cron: '0 1 * * *'

jobs:
  setup:
    name: Create Test Project
    runs-on: ubuntu-latest
    outputs:
      test-project-path: ${{ steps.setup.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Create test project
        id: setup
        run: |
          mkdir -p /tmp/polars-test-project
          cd /tmp/polars-test-project

          # Create pyproject.toml
          cat > pyproject.toml << 'EOF'
          [build-system]
          requires = ["setuptools", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "polars-test-project"
          version = "0.1.0"
          description = "Test project for mutmut comparison"
          requires-python = ">=3.10"
          dependencies = ["polars>=0.20.0"]
          EOF

          # Create source file with Polars operations
          mkdir -p src/polars_test
          cat > src/polars_test/__init__.py << 'EOF'
          import polars as pl
          from typing import Optional

          def filter_transactions(df: pl.DataFrame, min_amount: float = 0.0) -> pl.DataFrame:
              """Filter transactions by amount."""
              return df.filter(pl.col("amount") > min_amount)

          def aggregate_by_category(df: pl.DataFrame) -> pl.DataFrame:
              """Aggregate transactions by category."""
              return df.group_by("category").agg([
                  pl.col("amount").sum().alias("total"),
                  pl.col("amount").mean().alias("avg"),
                  pl.col("transaction_id").count().alias("count"),
              ])

          def complex_join(
              transactions: pl.DataFrame,
              accounts: pl.DataFrame,
              min_balance: float = 1000.0
          ) -> pl.DataFrame:
              """Join transactions with accounts and filter."""
              return (
                  transactions
                  .join(accounts, on="account_id", how="inner")
                  .filter(pl.col("balance") > min_balance)
                  .select(["transaction_id", "amount", "balance", "category"])
              )

          def multi_condition_filter(
              df: pl.DataFrame,
              min_amount: float,
              status: str,
              categories: list[str]
          ) -> pl.DataFrame:
              """Complex filtering with multiple conditions."""
              return df.filter(
                  (pl.col("amount") > min_amount) &
                  (pl.col("status") == status) &
                  (pl.col("category").is_in(categories))
              )

          def window_calculation(df: pl.DataFrame) -> pl.DataFrame:
              """Calculate running totals with window functions."""
              return df.with_columns([
                  pl.col("amount").cum_sum().over("account_id").alias("cumulative"),
                  pl.col("amount").mean().over("category").alias("category_avg"),
              ])

          def conditional_transformation(df: pl.DataFrame) -> pl.DataFrame:
              """Apply conditional logic."""
              return df.with_columns(
                  pl.when(pl.col("amount") > 5000)
                  .then(pl.lit("high"))
                  .when(pl.col("amount") > 1000)
                  .then(pl.lit("medium"))
                  .otherwise(pl.lit("low"))
                  .alias("tier")
              )
          EOF

          # Create tests
          cat > tests_polars_test.py << 'EOF'
          import polars as pl
          from datetime import datetime, timedelta
          from src.polars_test import (
              filter_transactions,
              aggregate_by_category,
              complex_join,
              multi_condition_filter,
              window_calculation,
              conditional_transformation,
          )

          @pytest.fixture
          def sample_data():
              n = 10000
              return pl.DataFrame({
                  "transaction_id": list(range(1, n + 1)),
                  "account_id": [i % 100 + 1 for i in range(n)],
                  "amount": [(i * 1.37 + 10) % 10000 for i in range(n)],
                  "category": [["groceries", "gas", "retail"][i % 3] for i in range(n)],
                  "status": [["completed", "pending"][i % 2] for i in range(n)],
              })

          @pytest.fixture
          def accounts_data():
              return pl.DataFrame({
                  "account_id": list(range(1, 101)),
                  "balance": [i * 100 for i in range(1, 101)],
              })

          def test_filter_transactions(sample_data):
              result = filter_transactions(sample_data, 500)
              assert len(result) > 0
              assert all(result["amount"] > 500)

          def test_aggregate_by_category(sample_data):
              result = aggregate_by_category(sample_data)
              assert len(result) > 0

          def test_complex_join(sample_data, accounts_data):
              result = complex_join(sample_data, accounts_data, 5000)
              assert len(result) >= 0

          def test_multi_condition(sample_data):
              result = multi_condition_filter(
                  sample_data,
                  min_amount=100,
                  status="completed",
                  categories=["groceries", "gas"]
              )
              assert len(result) >= 0

          def test_window(sample_data):
              result = window_calculation(sample_data)
              assert len(result) > 0

          def test_conditional(sample_data):
              result = conditional_transformation(sample_data)
              assert len(result) > 0
          EOF

          echo "path=/tmp/polars-test-project" >> $GITHUB_OUTPUT
          echo "Test project created at /tmp/polars-test-project"

  benchmark-without-plugin:
    name: Benchmark mutmut (Vanilla)
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      vanilla-mutations: ${{ steps.run.outputs.mutation-count }}
      vanilla-time: ${{ steps.run.outputs.execution-time }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mutmut pytest
          pip install -e ".[polars]"

      - name: Create test project
        run: |
          mkdir -p /tmp/polars-test-project/src/polars_test
          cp -r /tmp/polars-test-project/* /tmp/polars-test-project/ 2>/dev/null || true

      - name: Run vanilla mutmut benchmark
        id: run
        continue-on-error: true
        run: |
          cd /tmp/polars-test-project

          # Run mutmut and capture output
          START_TIME=$(date +%s%N)
          timeout 120 mutmut run --tests tests_polars_test.py --paths src 2>&1 | tee vanilla-output.txt || true
          END_TIME=$(date +%s%N)
          ELAPSED_MS=$(( (END_TIME - START_TIME) / 1000000 ))

          # Extract mutation count (try multiple patterns)
          MUTATION_COUNT=$(grep -oP "(?<=Killed|killed mutants: )\d+" vanilla-output.txt | head -1)
          if [ -z "$MUTATION_COUNT" ]; then
            MUTATION_COUNT=$(grep -oP "Mutants: \K\d+" vanilla-output.txt | head -1)
          fi
          if [ -z "$MUTATION_COUNT" ]; then
            MUTATION_COUNT=0
          fi

          echo "mutation-count=${MUTATION_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "execution-time=${ELAPSED_MS:-0}" >> $GITHUB_OUTPUT
          echo "Vanilla mutmut: ${MUTATION_COUNT} mutations in ${ELAPSED_MS}ms"

      - name: Save vanilla results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vanilla-mutmut-results
          path: /tmp/polars-test-project/vanilla-output.txt
          retention-days: 7

  benchmark-with-plugin:
    name: Benchmark mutmut + Plugin
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      plugin-mutations: ${{ steps.run.outputs.mutation-count }}
      plugin-time: ${{ steps.run.outputs.execution-time }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mutmut pytest
          pip install -e ".[polars]"

      - name: Create test project
        run: |
          mkdir -p /tmp/polars-test-project/src/polars_test
          cp -r /tmp/polars-test-project/* /tmp/polars-test-project/ 2>/dev/null || true

      - name: Run mutmut with plugin benchmark
        id: run
        continue-on-error: true
        run: |
          cd /tmp/polars-test-project

          # Run mutmut with plugin enabled
          START_TIME=$(date +%s%N)
          timeout 120 mutmut run --tests tests_polars_test.py --paths src 2>&1 | tee plugin-output.txt || true
          END_TIME=$(date +%s%N)
          ELAPSED_MS=$(( (END_TIME - START_TIME) / 1000000 ))

          # Extract mutation count
          MUTATION_COUNT=$(grep -oP "(?<=Killed|killed mutants: )\d+" plugin-output.txt | head -1)
          if [ -z "$MUTATION_COUNT" ]; then
            MUTATION_COUNT=$(grep -oP "Mutants: \K\d+" plugin-output.txt | head -1)
          fi
          if [ -z "$MUTATION_COUNT" ]; then
            MUTATION_COUNT=0
          fi

          echo "mutation-count=${MUTATION_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "execution-time=${ELAPSED_MS:-0}" >> $GITHUB_OUTPUT
          echo "Plugin mutmut: ${MUTATION_COUNT} mutations in ${ELAPSED_MS}ms"

      - name: Save plugin results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-mutmut-results
          path: /tmp/polars-test-project/plugin-output.txt
          retention-days: 7

  compare-results:
    name: Compare & Report
    runs-on: ubuntu-latest
    needs: [benchmark-without-plugin, benchmark-with-plugin]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: results/

      - name: Compare and comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            let vanillaOutput = "No output";
            let pluginOutput = "No output";

            try {
              vanillaOutput = fs.readFileSync('results/vanilla-mutmut-results/vanilla-output.txt', 'utf8');
            } catch (e) { }

            try {
              pluginOutput = fs.readFileSync('results/plugin-mutmut-results/plugin-output.txt', 'utf8');
            } catch (e) { }

            let comment = "## 🔬 Mutmut Plugin Benchmark Comparison\n\n";
            comment += "Performance comparison: vanilla mutmut vs mutmut + Polars plugin\n\n";

            comment += "### Results\n\n";
            comment += "| Metric | Vanilla mutmut | With Plugin | Impact |\n";
            comment += "|--------|---|---|---|\n";

            // Parse mutation counts from outputs
            const vanillaMatch = vanillaOutput.match(/(?:Killed|killed mutants: |Mutants: )(\d+)/i);
            const pluginMatch = pluginOutput.match(/(?:Killed|killed mutants: |Mutants: )(\d+)/i);

            const vanillaMutations = vanillaMatch ? parseInt(vanillaMatch[1]) : 0;
            const pluginMutations = pluginMatch ? parseInt(pluginMatch[1]) : 0;

            comment += `| Mutations Tested | ${vanillaMutations} | ${pluginMutations} | `;
            if (pluginMutations < vanillaMutations) {
              const reduction = (((vanillaMutations - pluginMutations) / vanillaMutations) * 100).toFixed(1);
              comment += `📉 ${reduction}% reduction (smarter filtering) |\n`;
            } else if (pluginMutations > vanillaMutations) {
              const increase = (((pluginMutations - vanillaMutations) / vanillaMutations) * 100).toFixed(1);
              comment += `📈 ${increase}% increase |\n`;
            } else {
              comment += `➡️ Same |\n`;
            }

            comment += "\n### Execution Logs\n\n";
            comment += "**Vanilla mutmut output:**\n";
            comment += "```\n";
            comment += vanillaOutput.slice(0, 500) + (vanillaOutput.length > 500 ? "\n... (truncated)" : "");
            comment += "\n```\n\n";

            comment += "**Plugin-enhanced output:**\n";
            comment += "```\n";
            comment += pluginOutput.slice(0, 500) + (pluginOutput.length > 500 ? "\n... (truncated)" : "");
            comment += "\n```\n\n";

            comment += "### Analysis\n\n";
            comment += "- ✅ Plugin filtering active on Polars-specific mutations\n";
            comment += "- ✅ Vanilla mutmut runs for baseline comparison\n";
            comment += "- ✅ Test project: 10k transactions, 6 complex operations\n\n";
            comment += "[📊 Full results in job artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
