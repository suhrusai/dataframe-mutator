          echo "MUTATIONS=$MUTS" >> $GITHUB_ENV
      - run: echo "Run 3: ${DURATION_MS}ms, ${MUTATIONS} mutations"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-plugin-3
          path: /tmp/plugin_3.log
