          MUTS=$(grep -oP 'Mutants created: \K[0-9]+' /tmp/vanilla_2.log | head -1 || echo "0")
          echo "MUTATIONS=$MUTS" >> $GITHUB_ENV
      - run: echo "Run 2: ${DURATION_MS}ms, ${MUTATIONS} mutations"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-vanilla-2
          path: /tmp/vanilla_2.log
          retention-days: 7

  benchmark-vanilla-3:
    name: Vanilla Run 3/10
