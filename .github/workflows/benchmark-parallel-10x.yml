  # 10 Parallel Plugin Benchmark Runs
  benchmark-plugin-1:
    name: Plugin Run 1/10
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install mutmut pytest polars && pip install -e ".[polars]"
      - run: |
          cd test_benchmark
          START=$(date +%s%N)
          mutmut run src/ --tests-dir tests/ --no-progress > /tmp/plugin_1.log 2>&1 || true
