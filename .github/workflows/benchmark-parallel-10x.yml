        with:
          python-version: "3.11"
      - run: pip install mutmut pytest polars && pip install -e ".[polars]"
      - run: |
          cd test_benchmark
          START=$(date +%s%N)
          mutmut run src/ --tests-dir tests/ --no-progress > /tmp/plugin_3.log 2>&1 || true
          END=$(date +%s%N)
          DURATION_MS=$(( (END - START) / 1000000 ))
          echo "DURATION_MS=$DURATION_MS" >> $GITHUB_ENV
