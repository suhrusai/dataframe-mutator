      - run: pip install mutmut pytest polars
      - run: |
          cd test_benchmark
          START=$(date +%s%N)
          mutmut run src/ --tests-dir tests/ --no-progress > /tmp/vanilla_5.log 2>&1 || true
          END=$(date +%s%N)
          DURATION_MS=$(( (END - START) / 1000000 ))
          echo "DURATION_MS=$DURATION_MS" >> $GITHUB_ENV
          MUTS=$(grep -oP 'Mutants created: \K[0-9]+' /tmp/vanilla_5.log | head -1 || echo "0")
          echo "MUTATIONS=$MUTS" >> $GITHUB_ENV
      - run: echo "Run 5: ${DURATION_MS}ms, ${MUTATIONS} mutations"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-vanilla-5
