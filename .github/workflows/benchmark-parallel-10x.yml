name: Benchmark Parallel (10x)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test_benchmark/**'
      - 'benchmarks/**'
  workflow_dispatch:

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mutmut pytest polars
          pip install -e ".[polars]"

  # 10 Parallel Vanilla Benchmark Runs
  benchmark-vanilla-1:
    name: Vanilla Run 1/10
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install mutmut pytest polars
      - run: |
          cd test_benchmark
          START=$(date +%s%N)
          mutmut run src/ --tests-dir tests/ --no-progress > /tmp/vanilla_1.log 2>&1 || true
          END=$(date +%s%N)
          DURATION_MS=$(( (END - START) / 1000000 ))
          echo "DURATION_MS=$DURATION_MS" >> $GITHUB_ENV
          MUTS=$(grep -oP 'Mutants created: \K[0-9]+' /tmp/vanilla_1.log | head -1 || echo "0")
          echo "MUTATIONS=$MUTS" >> $GITHUB_ENV
      - run: echo "Run 1: ${DURATION_MS}ms, ${MUTATIONS} mutations"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-vanilla-1
          path: /tmp/vanilla_1.log
          retention-days: 7

  benchmark-vanilla-2:
    name: Vanilla Run 2/10
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
