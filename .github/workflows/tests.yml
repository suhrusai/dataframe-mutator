name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})"
    strategy:
      matrix:
        include:
          # Linux x64 - all Python versions (3.10 through latest)
          - os: ubuntu-latest
            python-version: "3.10"
            arch: x64
          - os: ubuntu-latest
            python-version: "3.11"
            arch: x64
          - os: ubuntu-latest
            python-version: "3.12"
            arch: x64
          - os: ubuntu-latest
            python-version: "3.13"
            arch: x64
          - os: ubuntu-latest
            python-version: "3.14"
            arch: x64
          # macOS Intel - latest Python
          - os: macos-15-intel
            python-version: "3.14"
            arch: x64
          # Windows - latest Python
          - os: windows-latest
            python-version: "3.14"
            arch: x64
          # Linux ARM64 - latest Python
          - os: ubuntu-24.04-arm
            python-version: "3.14"
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify platform and Python
        run: |
          echo "Platform: ${{ matrix.os }} (${{ matrix.arch }})"
          python --version
          python -c "import sys; print(f'Platform: {sys.platform}')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,polars]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

      - name: Format check with black
        run: |
          black --check src/ tests/

      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=src/dataframe_mutator --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  test-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,polars]"

      - name: Run example tests
        run: |
          cd examples/etl-pipeline
          pytest tests/ -v
