name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run TPC-H benchmarks weekly
    - cron: '0 0 * * 0'

jobs:
  benchmark:
    # TPC-H benchmark on multiple platforms and architectures
    strategy:
      matrix:
        include:
          # Linux x64 (primary)
          - os: ubuntu-latest
            python: '3.11'
            arch: x64
          # macOS Intel
          - os: macos-15-intel
            python: '3.11'
            arch: x64
          # Windows x64
          - os: windows-latest
            python: '3.11'
            arch: x64
          # Linux ARM64
          - os: ubuntu-24.04-arm
            python: '3.11'
            arch: arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,polars]"
          pip install mutmut

      - name: Verify platform and architecture
        run: |
          echo "Running on: ${{ matrix.os }} (${{ matrix.arch }})"
          python --version
          python -c "import sys; print(f'Platform: {sys.platform}')"

      - name: Run TPC-H Benchmark (Industry Standard)
        run: |
          pytest benchmarks/test_tpch_inspired_workload.py -v --tb=short

      - name: Run Comprehensive Benchmarks
        run: |
          pytest benchmarks/test_extensive_polars_operations.py -v --tb=short

      - name: Benchmark with mutmut
        run: |
          echo "Measuring mutations with plugin..."
          mutmut run --paths src/ --tests-dir tests/ 2>&1 | tee mutmut_with_plugin.log || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ matrix.os }}-${{ matrix.arch }}
          path: benchmarks/results.json
          if-no-files-found: ignore

      - name: Comment PR with benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('benchmarks/results.json', 'utf8'));

            const dm = results.results.find(r => r.tool === 'dataframe-mutator');
            const mutmut = results.results.find(r => r.tool === 'mutmut');

            if (dm && mutmut) {
              const speedup = (mutmut.execution_time / dm.execution_time).toFixed(1);
              const timeSaved = (mutmut.execution_time - dm.execution_time).toFixed(2);

              const comment = `## Benchmark Results 📊

              | Tool | Time | Mutations | Speedup |
              |------|------|-----------|---------|
              | dataframe-mutator | ${dm.execution_time.toFixed(2)}s | ${dm.mutations_tested} | - |
              | mutmut | ${mutmut.execution_time.toFixed(2)}s | ${mutmut.mutations_tested} | ${speedup}x |

              **Time Saved:** ${timeSaved}s

              dataframe-mutator is **${speedup}x faster** than mutmut! 🚀`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
