name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run benchmarks weekly
    - cron: '0 0 * * 0'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,polars]"
          pip install mutmut

      - name: Run benchmarks
        run: |
          python benchmarks/benchmark_suite.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results.json

      - name: Comment PR with benchmark results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('benchmarks/results.json', 'utf8'));

            const dm = results.results.find(r => r.tool === 'dataframe-mutator');
            const mutmut = results.results.find(r => r.tool === 'mutmut');

            if (dm && mutmut) {
              const speedup = (mutmut.execution_time / dm.execution_time).toFixed(1);
              const timeSaved = (mutmut.execution_time - dm.execution_time).toFixed(2);

              const comment = `## Benchmark Results 📊

              | Tool | Time | Mutations | Speedup |
              |------|------|-----------|---------|
              | dataframe-mutator | ${dm.execution_time.toFixed(2)}s | ${dm.mutations_tested} | - |
              | mutmut | ${mutmut.execution_time.toFixed(2)}s | ${mutmut.mutations_tested} | ${speedup}x |

              **Time Saved:** ${timeSaved}s

              dataframe-mutator is **${speedup}x faster** than mutmut! 🚀`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
